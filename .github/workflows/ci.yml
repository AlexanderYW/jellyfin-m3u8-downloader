name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  commit-messages:
    # Releases and the changelog are derived from these, so a malformed subject is a build failure.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Conventional Commits
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|revert|refactor|docs|test|build|ci|chore|style)(\([^)]+\))?!?: .+'
          failed=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            # Merge commits are generated by GitHub and never carry a release meaning.
            if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ]; then continue; fi
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "::error::${sha:0:7} is not a Conventional Commit: $subject"
              failed=1
            fi
          done < <(git log --format='%H %s' "origin/${{ github.base_ref }}..HEAD")
          if [ "$failed" -ne 0 ]; then
            echo "Expected e.g. 'feat(queue): add retry backoff' or 'fix: handle empty playlist'."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.M3u8Downloader.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.M3u8Downloader.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.M3u8Downloader.sln --configuration Release --no-build --verbosity normal

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.M3u8Downloader
          path: Jellyfin.Plugin.M3u8Downloader/bin/Release/net9.0/Jellyfin.Plugin.M3u8Downloader.dll
          if-no-files-found: error
